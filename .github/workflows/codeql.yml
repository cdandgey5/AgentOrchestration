# CodeQL static analysis of the Python helpers (chat.py, package.py, install.py, demo/).
# The plugin itself is Markdown and JSON; this covers the optional tooling.
name: CodeQL

on:
  push:
    branches: ["main", "ccr-e1695eb1-odn01d"]
  pull_request:
    branches: ["main", "ccr-e1695eb1-odn01d"]
  schedule:
    - cron: "41 6 * * 2"   # weekly, Tuesday 06:41 UTC

permissions: read-all

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to the Security tab
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:python"
